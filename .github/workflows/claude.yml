name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  # Mention @claude on an issue, a PR comment or a review and Claude answers there.
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read

  # Put the "claude" label on an issue and Claude implements it and opens a PR.
  implement:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          additional_permissions: |
            actions: read
          prompt: |
            Implement this issue in full on the branch you have been given.
            Follow the conventions of the surrounding code.

            Run the test suite before you finish if the dependencies can be installed.
            Commit your work, push the branch, and open a pull request against main
            with `gh pr create`. The PR title is one sentence that says what changed.
            The PR body says what changed and why and ends with "Closes #<issue number>". Do not add a "Generated with Claude Code" line.
            If the issue cannot be implemented as written, say why in a comment on the issue instead of opening a PR.
          claude_args: '--allowed-tools "Bash(gh pr create:*),Bash(gh issue view:*),Bash(gh issue comment:*)"'
